<script>
// sempre em conexão segura
if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) location.replace('https://' + location.host + location.pathname + location.search + location.hash);
// se algo impedir o CRM de abrir, mostra aviso em vez de tela vazia
window.__crmFail = function () {
  if (document.getElementById('crmFail')) return;
  var d = document.createElement('div');
  d.id = 'crmFail';
  d.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:Aspekta,system-ui,sans-serif;background:#050505;color:#fff;z-index:9999';
  d.innerHTML = '<div><p style="font-size:20px;margin:0 0 8px">Não foi possível abrir o CRM</p><p style="color:#AFAFAF;margin:0 0 20px">Confira sua conexão e tente de novo.</p><button onclick="location.reload()" style="border:0;border-radius:10px;padding:12px 22px;background:linear-gradient(90deg,#FFAB00,#C98500);color:#fff;font-weight:700;cursor:pointer">Recarregar</button></div>';
  document.body.appendChild(d);
};
window.addEventListener('error', function (e) { if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) window.__crmFail(); }, true);
setTimeout(function () { var l = document.getElementById('login'), a = document.getElementById('app'); if (l && a && l.hidden && a.hidden) window.__crmFail(); }, 8000);
// aplica o tema antes de pintar a página (evita piscar)
(function () {
  var t = null;
  try { t = localStorage.getItem('tracto_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'dark'; // padrão: escuro (o claro é escolha manual)
  document.documentElement.dataset.theme = t;
})();
</script>
