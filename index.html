<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM | Tracto</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="https://assessoriatracto.com.br/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="https://assessoriatracto.com.br/assets/img/favicon.svg">
<link rel="stylesheet" href="https://assessoriatracto.com.br/assets/css/app.css?v=3">
<link rel="stylesheet" href="crm.css?v=eba7a90">
<script>
// aplica o tema antes de pintar a página (evita piscar)
(function () {
  var t = null;
  try { t = localStorage.getItem('tracto_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'dark'; // padrão: escuro (o claro é escolha manual)
  document.documentElement.dataset.theme = t;
})();
</script>
<!-- módulos compartilhados com o site principal (forms, banco). No deploy do subdomínio aponta pro domínio principal. -->
<script type="importmap">{ "imports": { "@shared/db.js": "https://assessoriatracto.com.br/assets/js/db.js?v=eba7a90", "@shared/forms.js": "https://assessoriatracto.com.br/assets/js/forms.js?v=eba7a90" } }</script>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login" hidden>
  <div class="login-theme"><button type="button" class="theme-btn" data-theme-toggle aria-label="Alternar modo claro e escuro"><svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
  <form class="login-card" id="loginForm">
    <img src="https://assessoriatracto.com.br/assets/img/tracto-logo.svg?v=3" alt="Tracto">
    <h1>Entrar no <em>CRM</em></h1>
    <div class="row"><label class="lbl" for="lEmail">E-mail</label><input class="inp" id="lEmail" type="email" autocomplete="username" required></div>
    <div class="row"><label class="lbl" for="lPass">Senha</label><input class="inp" id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-pill" type="submit" id="lBtn">ENTRAR <span class="chev">›</span></button>
    <p class="login-err" id="lErr"></p>
  </form>
</section>

<!-- APP -->
<div class="shell" id="app" hidden>
  <nav class="side" aria-label="Navegação">
    <div class="side-logo" aria-hidden="true">T</div>
    <a href="#/leads" data-route="leads" aria-label="Leads"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16.5c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4M14.5 10h3.5M14.5 14h3.5"/></svg><span class="dot" id="dueDot" hidden></span><span class="tip">Central de leads</span></a>
    <a href="#/dashboard" data-route="dashboard" aria-label="Dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="tip">Dashboard</span></a>
    <a href="#/formularios" data-route="formularios" aria-label="Formulários"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="tip">Formulários</span></a>
    <a href="#/integracoes" data-route="integracoes" aria-label="Integrações"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5M15 7l5 5-5 5M13.5 4l-3 16"/></svg><span class="tip">Integrações (API e webhooks)</span></a>
    <a href="#/pixel" data-route="pixel" aria-label="Pixel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span class="tip">Pixel e conversões (Meta)</span></a>
    <a href="#/ajustes" data-route="ajustes" aria-label="Ajustes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="tip">Ajustes</span></a>
    <div class="spacer"></div>
    <a href="#" class="theme-btn" data-theme-toggle role="button" aria-label="Alternar modo claro e escuro"><svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="tip">Modo claro / escuro</span></a>
    <a href="#" id="logoutBtn" aria-label="Sair"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="tip">Sair</span></a>
  </nav>

  <main class="main">
    <div class="demo-bar" id="demoBar" hidden>
      <span><b>Modo demo.</b> Os dados ficam só neste navegador. Configure o Supabase em assets/js/tracto-config.js pra usar de verdade.</span>
      <button class="b b-sm" id="seedBtn" type="button">Gerar leads de exemplo</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detalhes do lead"><div class="dr-body"></div></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://assessoriatracto.com.br/assets/js/tracto-config.js?v=eba7a90"></script>
<script type="module" src="app.js?v=eba7a90"></script>
</body>
</html>
